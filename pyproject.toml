[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-plane-kit-server-sdk"
version = "0.1.0"
description = "Framework-neutral workload node-control SDK for Control Plane Kit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "control-plane-kit-core @ https://github.com/OpenJ92/control-plane-kit/archive/0ee72c3fcdfbee5094357152bdf070fbfc53393c.zip#subdirectory=control-plane-kit-core",
]

[project.optional-dependencies]
verification = [
  "PyJWT==2.13.0",
  "cryptography==50.0.0",
]
fastapi = [
  "PyJWT==2.13.0",
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  "starlette==1.6.0",
]

[project.urls]
Repository = "https://github.com/OpenJ92/control-plane-kit-server-sdk"

[tool.setuptools.packages.find]
where = ["src"]
include = ["control_plane_kit_server_sdk*"]

[tool.setuptools.package-data]
control_plane_kit_server_sdk = ["py.typed"]
